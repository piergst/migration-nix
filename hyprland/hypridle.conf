general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim a bit before locking (laptop backlight only, harmless if no backlight)
listener {
    timeout = 480                                  # 8 min
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock
listener {
    timeout = 600                                  # 10 min
    on-timeout = loginctl lock-session
}

# Screen off (DPMS)
listener {
    timeout = 900                                  # 15 min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after a longer idle, but only if actually running on battery
# (upower comes from services.upower.enable already set in configuration.nix)
listener {
    timeout = 1800                                 # 30 min
    on-timeout = sh -c 'upower -i $(upower -e | grep BAT) | grep -q "state:.*discharging" && systemctl suspend'
}
